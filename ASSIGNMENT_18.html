<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        header, footer {
            background: navy; color: white; text-align: center; padding: 15px;
        }
        main { max-width: 650px; margin: auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid gray; padding: 8px; text-align: left; }
        fieldset { margin-top: 15px; }
        input, select, textarea { margin: 5px 0 12px; }
    </style>
</head>
<body>
    <header><h1>ABC College Admission 2026</h1></header>
    <main>
        <h2>Courses and Fees</h2>
        <table>
            <caption>Available Courses</caption>
            <tr><th>Course</th><th>Seats</th><th>Fees</th></tr>
            <tr><td>B.Tech CSE</td><td>120</td><td>₹90,000</td></tr>
            <tr><td>BCA</td><td>60</td><td>₹45,000</td></tr>
        </table>
        <form action="submit.php" method="post">
            <fieldset><legend>Application Form</legend>
                <label for="name">Name:</label><br>
                <input id="name" name="name" type="text" required><br>
                <label for="email">Email:</label><br>
                <input id="email" name="email" type="email" required><br>
                <label for="course">Course:</label><br>
                <select id="course" name="course">
                    <option>B.Tech CSE</option><option>BCA</option>
                </select><br>
                <label for="statement">Statement:</label><br>
                <textarea id="statement" name="statement" rows="4" cols="35"></textarea><br>
                <button type="submit">Apply</button>
            </fieldset>
        </form>
    </main>
    <footer>&copy; 2026 ABC College</footer>
</body>
</html>
